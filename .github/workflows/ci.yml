name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-service:
    name: ledger-service (Java 25, Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Checkstyle + javac -Xlint -Werror + unit, integration and concurrency tests (Testcontainers)
      - run: sh mvnw -B verify

  provider-sim:
    name: provider-sim (Java 25, Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/provider-sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: sh mvnw -B verify

  security-scan:
    name: Security scan (dependencies, secrets, misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  end-to-end:
    name: Docker Compose stack + demo flow
    needs: [ledger-service, provider-sim]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      # Top-up, transfer, refund and reconciliation against the real stack (PowerShell 7 on the runner)
      - run: pwsh ./scripts/demo.ps1
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
