version: 2
updates:
  - package-ecosystem: maven
    directory: /services/ledger-service
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
  - package-ecosystem: maven
    directory: /services/provider-sim
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/services/ledger-service", "/services/provider-sim"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
